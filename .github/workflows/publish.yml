name: Test, Build, and Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tooling and Code Puppy core
        run: |
          pip install uv
          uv venv
          uv pip install "code-puppy @ git+https://github.com/mpfaffenberger/code_puppy.git@main"
          uv pip install -e . --group dev
      - name: Quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        env:
          CI: '1'
          CODE_PUPPY_TEST_FAST: '1'
        run: uv run pytest -q

  minimum-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum supported runtime
        run: |
          pip install uv
          uv venv
          uv pip install "code-puppy @ git+https://github.com/mpfaffenberger/code_puppy.git@757db1cf33138dcf34ea58a7888f4a16f4f4ca1c"
          uv pip install -e . --group dev
          uv pip install "pydantic>=2.11,<2.12"
      - name: Minimum-version spill contract
        env:
          CI: '1'
          CODE_PUPPY_TEST_FAST: '1'
        run: |
          uv run --no-sync python -c 'import pydantic; assert pydantic.__version__.startswith("2.11.")'
          uv run --no-sync pytest -q tests/test_spill.py tests/test_spill_models.py tests/test_spill_static_gate.py

  coordinated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tooling and coordinated Code Puppy runtime
        run: |
          pip install uv
          uv venv
          uv pip install "code-puppy @ git+https://github.com/thomwebb/code_puppy.git@dcb6618454a6ba22ccf7077a20f12c92d82fc847"
          uv pip install -e . --group dev
      - name: Coordinated spill contract
        env:
          CI: '1'
          CODE_PUPPY_TEST_FAST: '1'
        run: uv run pytest -q tests/test_spill.py tests/test_spill_models.py tests/test_spill_context.py tests/test_spill_static_gate.py

  build-publish:
    runs-on: ubuntu-latest
    needs: [test, minimum-compatibility, coordinated-contract]
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release tooling
        run: pip install uv build twine
      - name: Bump patch version
        run: uv version --bump patch
      - name: Capture version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv run twine upload --verbose --skip-existing dist/*
      - name: Push version bump and tag
        if: env.HAS_PYPI_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version [ci skip]" || true
          TAG="v${{ steps.version.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 5; continue; }
            git tag -f -a "$TAG" -m "Release $TAG"
            if git push origin main; then
              git push origin "$TAG" || true
              exit 0
            fi
            sleep 5
          done
          exit 1
